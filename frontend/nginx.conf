# 프론트엔드(정적 파일)와 백엔드(/api, /media)를 같은 origin으로 묶는다.
# 세션 쿠키를 쓰므로 CORS 설정이 필요 없다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 사진, 컴카드, 연기영상 multipart 업로드 (기본값 1MB로는 업로드가 실패한다)
    client_max_body_size 500m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 백엔드로 보내는 공통 설정
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # PDF 병합/변환, 큰 파일 업로드처럼 오래 걸리는 요청용
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location /media/ {
        proxy_pass http://backend:8000;
    }

    # 해시가 붙은 빌드 결과물은 오래 캐시한다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 라우팅: 파일이 없으면 index.html (index.html은 캐시하지 않는다)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
