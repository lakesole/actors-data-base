version: "3.8"

services:
  actor_db:
    build: ./backend
    container_name: actor_db
    ports:
      - "8000:8000"
    # .env.example을 복사해서 .env를 만들어야 한다 (SECRET_KEY 필수)
    env_file:
      - .env
    environment:
      STORAGE_DIR: /storage   # DB, 업로드 파일, 병합 PDF
    volumes:
      - ./backend:/app
      - ./storage:/storage
    restart: always
