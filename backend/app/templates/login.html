{% extends "base.html" %}
{% block content %}

<div class="form-wrap" style="max-width: 460px; margin: 40px auto;">
  <h1 class="form-title">로그인</h1>

  <form class="form" method="post" action="/login">
    <div class="grid-form" style="grid-template-columns: 1fr;">
      <div class="field">
        <label>아이디</label>
        <input type="text" name="username" required placeholder="아이디 입력">
      </div>

      <div class="field">
        <label>비밀번호</label>
        <input type="password" name="password" required placeholder="비밀번호 입력">
      </div>
    </div>

    {% if error %}
      <div style="margin-top:12px; color:#d33; font-size:14px;">{{ error }}</div>
    {% endif %}

    <div class="form-actions" style="margin-top:20px;">
      <button class="btn primary" type="submit">로그인</button>
      <a class="btn" href="/">취소</a>
    </div>
  </form>
</div>

{% endblock %}
