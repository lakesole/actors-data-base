{% extends "base.html" %}
{% block content %}

<div class="detail-top">
  <a class="back" href="/">← 목록으로</a>
</div>

<div class="form-wrap" style="max-width:640px; margin:0 auto;">
  <h1 class="form-title">비밀번호 변경</h1>

  {% if error %}
    <div class="alert error" style="margin-bottom:16px;">{{ error }}</div>
  {% endif %}

  {% if success %}
    <div class="alert success" style="margin-bottom:16px;">비밀번호가 변경되었습니다.</div>
  {% endif %}

  <form class="form" method="post" action="/account/password">
    <div class="grid-form" style="grid-template-columns:1fr;">
      <div class="field">
        <label>현재 비밀번호</label>
        <input type="password" name="current_password" required>
      </div>

      <div class="field">
        <label>새 비밀번호</label>
        <input type="password" name="new_password" required>
      </div>

      <div class="field">
        <label>새 비밀번호 확인</label>
        <input type="password" name="new_password_confirm" required>
      </div>
    </div>

    <div class="form-actions" style="margin-top:20px;">
      <button class="btn primary" type="submit">비밀번호 저장</button>
      <a class="btn" href="/">취소</a>
    </div>
  </form>
</div>

{% endblock %}
