{% extends "base.html" %}
{% block content %}

<div class="detail-top">
  <a class="back" href="/actors/{{ actor['id'] }}?tab=compcard&q={{ q or '' }}&m={{ m or '' }}&ai_query={{ ai_query or '' }}&gender={{ gender or '' }}&height_group={{ height_group or '' }}&birth_group={{ birth_group or '' }}&sort={{ sort or '' }}&view={{ view or 'card' }}&page={{ page or 1 }}&per_page={{ per_page or 20 }}&status_filter={{ status_filter or '' }}">← 상세페이지</a>
</div>

<div class="form-wrap">
  <h1 class="form-title">배우정보 수정</h1>

  <form class="form" method="post" action="/actors/{{ actor['id'] }}/edit" enctype="multipart/form-data">
    <input type="hidden" name="q" value="{{ q or '' }}">
    <input type="hidden" name="m" value="{{ m or '' }}">
    <input type="hidden" name="ai_query" value="{{ ai_query or '' }}">
    <input type="hidden" name="gender_filter" value="{{ gender or '' }}">
    <input type="hidden" name="height_group" value="{{ height_group or '' }}">
    <input type="hidden" name="birth_group" value="{{ birth_group or '' }}">
    <input type="hidden" name="sort" value="{{ sort or '' }}">
    <input type="hidden" name="view" value="{{ view or 'card' }}">
    <input type="hidden" name="page" value="{{ page or 1 }}">
    <input type="hidden" name="per_page" value="{{ per_page or 20 }}">
    <input type="hidden" name="status_filter" value="{{ status_filter or '' }}">

    <div class="grid-form">
      <div class="field">
        <label>이름 *</label>
        <input type="text" name="name" required value="{{ actor['name'] }}">
      </div>

      <div class="field">
        <label>담당 매니저</label>
        <input
          type="text"
          name="manager_name"
          value="{{ actor['manager_name'] if actor['manager_name'] else '' }}"
          placeholder="예: 홍길동">
      </div>

      <div class="field">
        <label>담당 선생님</label>
        <select name="teacher_user_id">
          <option value="">미지정</option>
          {% for t in teacher_users %}
            <option value="{{ t['id'] }}" {% if actor['teacher_user_id'] == t['id'] %}selected{% endif %}>
              {{ t['display_name'] }}
              {% if t['lesson_subject'] %} · {{ t['lesson_subject'] }}{% endif %}
              {% if t['lesson_days'] %} ({{ t['lesson_days'] }}){% endif %}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="field">
        <label>전화번호 뒤 4자리</label>
        <input
          type="text"
          name="phone_last4"
          inputmode="numeric"
          maxlength="4"
          placeholder="예: 1234"
          value="{{ actor['phone_last4'] if actor['phone_last4'] else '' }}"
          oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,4)">
      </div>

      <div class="field">
        <label>성별</label>
        <select name="gender">
          <option value="">선택</option>
          <option value="남자" {% if actor['gender'] == '남자' %}selected{% endif %}>남자</option>
          <option value="여자" {% if actor['gender'] == '여자' %}selected{% endif %}>여자</option>
        </select>
      </div>

      <div class="field year-field">
        <label>년생</label>
        <input
          type="text"
          name="birth_year"
          inputmode="numeric"
          maxlength="4"
          minlength="4"
          pattern="[0-9]{4}"
          value="{{ actor['birth_year'] if actor['birth_year'] else '' }}"
          oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,4)">
      </div>

      <div class="field">
        <label>키(cm)</label>
        <input type="number" step="0.1" name="height_cm" value="{{ actor['height_cm'] if actor['height_cm'] else '' }}">
      </div>

      <div class="field">
        <label>몸무게(kg)</label>
        <input type="number" step="0.1" name="weight_kg" value="{{ actor['weight_kg'] if actor['weight_kg'] else '' }}">
      </div>

      <div class="field">
        <label>학교</label>
        <input type="text" name="school" value="{{ actor['school'] if actor['school'] else '' }}">
      </div>

      <div class="field">
        <label>취미</label>
        <input type="text" name="hobby" value="{{ actor['hobby'] if actor['hobby'] else '' }}">
      </div>

      <div class="field full">
        <label>특기</label>
        <input type="text" name="specialty" value="{{ actor['specialty'] if actor['specialty'] else '' }}">
      </div>

      <div class="field date-field">
        <label>계약 시작일</label>
        <input
          type="text"
          class="date-text"
          id="contract_date"
          name="contract_date"
          inputmode="numeric"
          maxlength="10"
          placeholder="YYYY-MM-DD"
          value="{{ actor['contract_date'] if actor['contract_date'] else '' }}">
      </div>

      <div class="field date-field">
        <label>계약 만료일</label>
        <input
          type="text"
          class="date-text"
          id="contract_end_date"
          name="contract_end_date"
          inputmode="numeric"
          maxlength="10"
          placeholder="YYYY-MM-DD"
          value="{{ actor['contract_end_date'] if actor['contract_end_date'] else '' }}">
      </div>

      <div class="field full">
        <label>메모</label>
        <textarea name="bio" rows="4">{{ actor['bio'] if actor['bio'] else '' }}</textarea>
      </div>
    </div>

    <div class="upload-block">
      <div class="upload-title">파일 관리 (선택)</div>

      <div class="upload-row upload-row-3">
        <div class="u">
          <div class="u-label">프로필 사진 (올리면 교체)</div>
          <input class="file" type="file" name="photo" accept="image/*">
        </div>

        <div class="u">
          <div class="u-label">컴카드 (올리면 교체)</div>
          <input class="file" type="file" name="compcard" accept=".pdf,image/*,.ppt,.pptx">
        </div>

        <div class="u">
          <div class="u-label">연기영상 (올리면 누적 추가, 여러 개 가능)</div>
          <input class="file" type="file" name="acting_videos" accept="video/*" multiple>
        </div>
      </div>

      <div class="upload-hint">연기영상은 기존 영상이 삭제되지 않고 계속 누적됩니다.</div>
    </div>

    <div class="form-actions">
      <button class="btn primary" type="submit">저장</button>
      <a class="btn" href="/actors/{{ actor['id'] }}?tab=compcard&q={{ q or '' }}&m={{ m or '' }}&ai_query={{ ai_query or '' }}&gender={{ gender or '' }}&height_group={{ height_group or '' }}&birth_group={{ birth_group or '' }}&sort={{ sort or '' }}&view={{ view or 'card' }}&page={{ page or 1 }}&per_page={{ per_page or 20 }}&status_filter={{ status_filter or '' }}">취소</a>
    </div>
  </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const form = document.querySelector(".form");
  const birthYearInput = document.querySelector('input[name="birth_year"]');
  const contractDateInput = document.getElementById("contract_date");
  const contractEndDateInput = document.getElementById("contract_end_date");

  function formatDateInput(el) {
    if (!el) return;
    el.addEventListener("input", function () {
      let v = this.value.replace(/[^0-9]/g, "").slice(0, 8);
      if (v.length >= 5) {
        v = v.slice(0, 4) + "-" + v.slice(4);
      }
      if (v.length >= 8) {
        v = v.slice(0, 7) + "-" + v.slice(7);
      }
      this.value = v;
    });
  }

  formatDateInput(contractDateInput);
  formatDateInput(contractEndDateInput);

  if (form && birthYearInput) {
    form.addEventListener("submit", function () {
      birthYearInput.value = birthYearInput.value.replace(/[^0-9]/g, "").slice(0, 4);
      if (contractDateInput) {
        contractDateInput.value = contractDateInput.value.replace(/[^0-9-]/g, "").slice(0, 10);
      }
      if (contractEndDateInput) {
        contractEndDateInput.value = contractEndDateInput.value.replace(/[^0-9-]/g, "").slice(0, 10);
      }
    });
  }
});
</script>

{% endblock %}
